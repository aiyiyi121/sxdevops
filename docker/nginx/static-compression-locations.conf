location ~ ^/assets/.+[.]js$ {
    types { application/javascript js br; }
    expires 1y;
    access_log off;
    include /etc/nginx/snippets/sxdevops-static-compression-response.conf;
}

location ~ ^/assets/.+[.]css$ {
    types { text/css css br; }
    expires 1y;
    access_log off;
    include /etc/nginx/snippets/sxdevops-static-compression-response.conf;
}

location ~ ^/(assets|promo)/.+[.]svg$ {
    types { image/svg+xml svg br; }
    expires 1d;
    include /etc/nginx/snippets/sxdevops-static-compression-response.conf;
}

location ~ ^/assets/.+[.]json$ {
    types { application/json json br; }
    expires 1d;
    include /etc/nginx/snippets/sxdevops-static-compression-response.conf;
}

location ~ ^/assets/.+[.]txt$ {
    types { text/plain txt br; }
    expires 1d;
    include /etc/nginx/snippets/sxdevops-static-compression-response.conf;
}
