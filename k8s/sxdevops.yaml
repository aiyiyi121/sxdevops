# Replace the sample secrets and all application image references before applying.
# Use the same immutable image digest for web, scheduler, worker and schema gates.
apiVersion: v1
kind: Namespace
metadata:
  name: sxdevops
---
apiVersion: v1
kind: Secret
metadata:
  name: sxdevops-secrets
  namespace: sxdevops
type: Opaque
stringData:
  MYSQL_PASSWORD: sxdevops_password
  MYSQL_ROOT_PASSWORD: sxdevops_root_password
  SECRET_KEY: sxdevops-change-me-in-production
  CMDB_PASSWORD_ENCRYPTION_KEY: replace-with-generated-persistent-fernet-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sxdevops-config
  namespace: sxdevops
data:
  DATABASE_ENGINE: mysql
  MYSQL_HOST: mysql
  MYSQL_PORT: '3306'
  MYSQL_DATABASE: sxdevops
  MYSQL_USER: sxdevops
  REDIS_URL: redis://redis:6379/0
  CHANNEL_REDIS_URL: redis://redis:6379/1
  DEBUG: '0'
  ALLOWED_HOSTS: '*'
  CORS_ALLOW_ALL_ORIGINS: '0'
  SXDEVOPS_WAIT_FOR_DB: '1'
  SXDEVOPS_MIGRATE: '1'
  SXDEVOPS_SEED_DATA: '0'
  SXDEVOPS_SEED_TEMPLATES: '1'
  TZ: Asia/Shanghai
  CACHE_BACKEND: redis
  CACHE_IGNORE_EXCEPTIONS: '0'
  AIOPS_LANGGRAPH_CHECKPOINT_BACKEND: mysql
  SXDEVOPS_TRUSTED_PROXIES: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: sxdevops
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: sxdevops
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sxdevops
spec:
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: sxdevops
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sxdevops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/part-of: sxdevops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: sxdevops
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        imagePullPolicy: IfNotPresent
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --default-authentication-plugin=mysql_native_password
        ports:
        - name: mysql
          containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: sxdevops-config
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: sxdevops-config
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: sxdevops-config
              key: TZ
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
          periodSeconds: 20
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmdb-sync-scheduler
  namespace: sxdevops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cmdb-sync-scheduler
      app.kubernetes.io/part-of: sxdevops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmdb-sync-scheduler
        app.kubernetes.io/part-of: sxdevops
    spec:
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.36.1
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - 'until nc -z mysql 3306; do sleep 2; done

          until nc -z redis 6379; do sleep 2; done

          '
      - name: wait-for-schema
        image: registry.example.com/sxdevops/sxdevops:latest
        imagePullPolicy: Always
        command:
        - python
        - manage.py
        - wait_for_schema
        - --timeout
        - '600'
        envFrom:
        - configMapRef:
            name: sxdevops-config
        env:
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: MYSQL_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: SECRET_KEY
        - name: CMDB_PASSWORD_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: CMDB_PASSWORD_ENCRYPTION_KEY
        - name: SXDEVOPS_MIGRATE
          value: '0'
        - name: SXDEVOPS_SEED_DATA
          value: '0'
        - name: SXDEVOPS_SEED_TEMPLATES
          value: '0'
      containers:
      - name: cmdb-sync-scheduler
        image: registry.example.com/sxdevops/sxdevops:latest
        imagePullPolicy: Always
        command:
        - python
        - manage.py
        - run_cmdb_sync_scheduler
        - --interval
        - '60'
        - --limit
        - '10'
        envFrom:
        - configMapRef:
            name: sxdevops-config
        env:
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: MYSQL_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: SECRET_KEY
        - name: CMDB_PASSWORD_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: CMDB_PASSWORD_ENCRYPTION_KEY
        - name: SXDEVOPS_MIGRATE
          value: '0'
        - name: SXDEVOPS_SEED_DATA
          value: '0'
        - name: SXDEVOPS_SEED_TEMPLATES
          value: '0'
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sxdevops
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: sxdevops
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sxdevops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: sxdevops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: sxdevops
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        args:
        - redis-server
        - --appendonly
        - 'yes'
        ports:
        - name: redis
          containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: sxdevops
  namespace: sxdevops
spec:
  selector:
    app.kubernetes.io/name: sxdevops
    app.kubernetes.io/part-of: sxdevops
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sxdevops
  namespace: sxdevops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sxdevops
      app.kubernetes.io/part-of: sxdevops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sxdevops
        app.kubernetes.io/part-of: sxdevops
    spec:
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.36.1
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - 'until nc -z mysql 3306; do sleep 2; done

          until nc -z redis 6379; do sleep 2; done

          '
      containers:
      - name: sxdevops
        image: registry.example.com/sxdevops/sxdevops:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: MYSQL_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: SECRET_KEY
        - name: CMDB_PASSWORD_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: sxdevops-secrets
              key: CMDB_PASSWORD_ENCRYPTION_KEY
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        envFrom:
        - configMapRef:
            name: sxdevops-config
---
